<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JICA KPI icons</title>
  <style>
    body { margin: 0; background: #070B14; color: #E8EEF7; font-family: "Segoe UI", sans-serif; padding: 28px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 18px; color: #8B9BB4; letter-spacing: .04em; text-transform: uppercase; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .tile { width: 150px; background: #121B2C; border: 1px solid #1E2A40; border-radius: 12px; padding: 18px 14px; text-align: center; }
    .icon { width: 40px; height: 40px; margin: 0 auto 10px; }
    .icon svg { width: 40px; height: 40px; }
    .name { font-size: 11px; color: #8B9BB4; letter-spacing: .06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Harmonized indicator icons — 24×24 stroke</h1>
  <div class="row">
    <div class="tile"><div class="icon" style="color:#E8EEF7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="11" height="8" rx="1.5"/><rect x="7.5" y="8.5" width="11" height="8" rx="1.5"/><path d="M10 12.5h5M10 15h3.5"/></svg></div><div class="name">Schemes</div></div>
    <div class="tile"><div class="icon" style="color:#3DDC97"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="6.5"/><path d="m9.2 11.2 1.9 1.9 3.8-3.9"/><path d="M8.2 17.8 7 21l5-1.6L17 21l-1.2-3.2"/></svg></div><div class="name">Awarded</div></div>
    <div class="tile"><div class="icon" style="color:#F5C15A"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.5" rx="6.5" ry="2.4"/><path d="M5.5 6.5v3.2c0 1.3 2.9 2.4 6.5 2.4s6.5-1.1 6.5-2.4V6.5"/><path d="M5.5 9.7v3.2c0 1.3 2.9 2.4 6.5 2.4s6.5-1.1 6.5-2.4V9.7"/><path d="M5.5 12.9v3.2c0 1.3 2.9 2.4 6.5 2.4s6.5-1.1 6.5-2.4v-3.2"/></svg></div><div class="name">Awarded cost</div></div>
    <div class="tile"><div class="icon" style="color:#2EE6D6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.2 12 4.5l8 3.2-2.2 8.6L9.5 20 4.8 14.2z"/><path d="M12 4.5v6.2l6.2 1.4"/></svg></div><div class="name">Area</div></div>
    <div class="tile"><div class="icon" style="color:#5B8CFF"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.2" cy="8" r="2.3"/><path d="M3.8 16.8c.3-2.4 1.9-3.7 4.4-3.7s4.1 1.3 4.4 3.7"/><circle cx="15.8" cy="8.4" r="2.1"/><path d="M12.6 16.8c.4-2 1.7-3.2 3.8-3.2 2.2 0 3.6 1.3 3.8 3.2"/></svg></div><div class="name">Households</div></div>
    <div class="tile"><div class="icon" style="color:#2EE6D6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h16"/><path d="M4 16.5h16"/><path d="M6 11.5c1.4 1.2 2.6 1.2 4 0s2.6-1.2 4 0 2.6 1.2 4 0"/><path d="M8 5.5 6.5 7.5 8 9.2"/><path d="M16 14.8 17.5 16.5 16 18.5"/></svg></div><div class="name">Canal km</div></div>
    <div class="tile"><div class="icon" style="color:#3DDC97"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a7.5 7.5 0 1 1-6.4 3.6"/><path d="M12 4.5v4.2l3 1.6"/></svg></div><div class="name">Physical works</div></div>
  </div>
</body>
</html>
